name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Home Assistant and HACS move on their own; a weekly run catches breakage
    # that no commit of ours caused.
    - cron: "23 4 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration
