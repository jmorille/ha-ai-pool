name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      # Linting needs ruff only; installing the Home Assistant test harness
      # here would add minutes for nothing.
      - run: pip install -r requirements-lint.txt
      - name: Lint
        run: ruff check custom_components tests
      - name: Format check
        run: ruff format --check custom_components tests

  test:
    name: Tests (HA ${{ matrix.ha }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each harness release pins exactly one Home Assistant version, so the
        # harness version is how a Home Assistant version gets tested. The
        # oldest entry here is what hacs.json declares as the minimum.
        include:
          - ha: "2026.8.3"
            harness: "0.13.357"
          - ha: "2026.9.0"
            harness: "0.13.362"
            coverage: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install
        run: |
          pip install --upgrade pip
          pip install "pytest-homeassistant-custom-component==${{ matrix.harness }}"
          python scripts/component_requirements.py > component-requirements.txt
          cat component-requirements.txt
          pip install -r component-requirements.txt
      - name: Test
        run: |
          pytest tests \
            --cov=custom_components.ai_pool \
            --cov-report=term-missing \
            --cov-report=xml \
            -q
      - name: Upload coverage
        if: matrix.coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
